<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本国憲法 暗記ツール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; background: #faf8f3; color: #2c2c2c; }

    header { background: #1a3a5c; color: white; padding: 16px 24px; }
    header h1 { font-size: 1.4rem; font-weight: normal; letter-spacing: 0.1em; }

    .container { display: flex; height: calc(100vh - 56px); }

    /* サイドバー */
    .sidebar { width: 280px; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; flex-shrink: 0; }
    .sidebar-section { border-bottom: 1px solid #eee; }
    .sidebar-section-title {
      padding: 10px 16px; font-size: 0.78rem; color: #666;
      background: #f5f5f5; letter-spacing: 0.05em; font-weight: bold;
    }
    .chapter-btn {
      display: block; width: 100%; text-align: left; padding: 8px 16px;
      background: none; border: none; cursor: pointer; font-size: 0.85rem;
      color: #333; font-family: inherit;
    }
    .chapter-btn:hover { background: #eef4fb; }
    .chapter-btn.active { background: #1a3a5c; color: white; }

    .article-list { padding: 4px 0; }
    .article-btn {
      display: block; width: 100%; text-align: left; padding: 6px 24px;
      background: none; border: none; cursor: pointer; font-size: 0.82rem;
      color: #444; font-family: inherit;
    }
    .article-btn:hover { background: #eef4fb; }
    .article-btn.active { color: #1a3a5c; font-weight: bold; }

    /* メイン */
    .main { flex: 1; overflow-y: auto; padding: 32px; }
    .empty-state { color: #999; text-align: center; margin-top: 80px; font-size: 1rem; }

    .practice-card {
      max-width: 720px; margin: 0 auto; background: white;
      border: 1px solid #ddd; border-radius: 8px; padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .article-header { margin-bottom: 20px; }
    .article-number { font-size: 1rem; color: #1a3a5c; font-weight: bold; letter-spacing: 0.05em; }
    .article-title { font-size: 0.85rem; color: #666; margin-top: 4px; }

    .text-area { min-height: 120px; margin: 20px 0; }
    .hidden-text {
      background: #2c2c2c; color: #2c2c2c; border-radius: 4px;
      line-height: 2.2; font-size: 1rem; padding: 16px;
      user-select: none; cursor: default;
      transition: all 0.4s ease;
    }
    .hidden-text.revealed { background: transparent; color: #2c2c2c; }

    .reveal-btn {
      display: block; margin: 0 auto; padding: 12px 40px;
      background: #1a3a5c; color: white; border: none; border-radius: 6px;
      font-size: 1rem; cursor: pointer; font-family: inherit; letter-spacing: 0.05em;
    }
    .reveal-btn:hover { background: #24527a; }
    .reveal-btn.revealed { background: #999; cursor: default; }

    .nav-btns { display: flex; justify-content: space-between; margin-top: 24px; }
    .nav-btn {
      padding: 8px 20px; background: #f0f0f0; border: 1px solid #ccc;
      border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.85rem;
    }
    .nav-btn:hover { background: #e0e0e0; }
    .nav-btn:disabled { opacity: 0.4; cursor: default; }

    /* 複数選択モード */
    .multi-controls { padding: 12px 16px; background: #f5f5f5; border-bottom: 1px solid #eee; }
    .multi-controls button {
      margin-right: 8px; padding: 4px 10px; font-size: 0.75rem;
      border: 1px solid #ccc; background: white; border-radius: 3px; cursor: pointer; font-family: inherit;
    }
    .multi-controls button:hover { background: #eef4fb; }
    .start-btn {
      display: block; width: calc(100% - 32px); margin: 12px 16px;
      padding: 10px; background: #1a3a5c; color: white; border: none;
      border-radius: 5px; font-size: 0.9rem; cursor: pointer; font-family: inherit;
    }
    .start-btn:hover { background: #24527a; }
    .start-btn:disabled { background: #aaa; cursor: default; }

    .progress { font-size: 0.8rem; color: #666; text-align: center; margin-bottom: 16px; }
  </style>
</head>
<body>
<header><h1>日本国憲法 暗記ツール</h1></header>
<div class="container">
  <div class="sidebar" id="sidebar">
    <div class="multi-controls">
      <button onclick="selectAll()">全選択</button>
      <button onclick="clearAll()">解除</button>
      <button id="start-btn" class="start-btn" onclick="startPractice()" disabled>練習開始</button>
    </div>
    <div id="chapter-list"></div>
  </div>
  <div class="main" id="main">
    <div class="empty-state">←左から条文を選んで練習を開始してください</div>
  </div>
</div>
<script src="articles.js"></script>
<script src="app.js"></script>
</body>
</html>
