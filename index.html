<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本国憲法 暗記ツール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; background: #faf8f3; color: #2c2c2c; }

    header {
      background: #1a3a5c; color: white;
      padding: 0 16px; height: 52px;
      display: flex; align-items: center; gap: 14px;
      position: sticky; top: 0; z-index: 100;
    }
    #menu-btn {
      background: none; border: none; color: white;
      font-size: 1.6rem; cursor: pointer;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; flex-shrink: 0;
      -webkit-tap-highlight-color: rgba(255,255,255,0.2);
    }
    header h1 { font-size: 1.05rem; font-weight: normal; letter-spacing: 0.1em; }

    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 150;
    }

    .sidebar {
      display: none;
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 85%; max-width: 320px;
      background: #fff; z-index: 200;
      flex-direction: column;
      box-shadow: 4px 0 24px rgba(0,0,0,0.25);
    }
    /* JSでstyle.displayを直接操作するのでクラスは不要 */

    .sidebar-top {
      background: #1a3a5c; color: white;
      height: 52px; display: flex; align-items: center;
      padding: 0 16px; gap: 12px; flex-shrink: 0;
    }
    #close-btn {
      background: none; border: none; color: white;
      font-size: 1.3rem; cursor: pointer;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 5px;
      -webkit-tap-highlight-color: rgba(255,255,255,0.2);
    }
    .sidebar-top span { font-size: 0.9rem; letter-spacing: 0.05em; }

    .sidebar-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    .sidebar-footer {
      padding: 14px 16px 24px; border-top: 1px solid #ddd;
      background: #f5f5f5; flex-shrink: 0;
    }
    .multi-controls { display: flex; gap: 8px; margin-bottom: 10px; }
    .multi-controls button {
      flex: 1; padding: 10px 0; font-size: 0.85rem;
      border: 1px solid #bbb; background: white; border-radius: 6px;
      cursor: pointer; font-family: inherit;
    }
    .start-btn {
      display: block; width: 100%;
      padding: 16px; background: #1a3a5c; color: white; border: none;
      border-radius: 8px; font-size: 1rem; cursor: pointer;
      font-family: inherit; letter-spacing: 0.1em;
    }
    .start-btn:disabled { background: #aaa; cursor: default; }

    .sidebar-section { border-bottom: 1px solid #eee; }
    .sidebar-section-title {
      padding: 10px 16px; font-size: 0.78rem; color: #666;
      background: #f5f5f5; letter-spacing: 0.05em; font-weight: bold;
    }
    .article-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 12px 16px;
      background: none; border: none; cursor: pointer;
      font-size: 0.85rem; color: #444; font-family: inherit; text-align: left;
      -webkit-tap-highlight-color: rgba(0,0,0,0.05);
    }
    .article-btn.active { background: #e8f0f9; color: #1a3a5c; font-weight: bold; }
    .article-btn input[type=checkbox] { flex-shrink: 0; width: 18px; height: 18px; }

    .main { min-height: calc(100vh - 52px); padding: 32px 16px; }
    .empty-state { color: #999; text-align: center; margin-top: 120px; font-size: 1rem; line-height: 3; }

    .practice-card {
      max-width: 680px; margin: 0 auto; background: white;
      border: 1px solid #ddd; border-radius: 10px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .article-number { font-size: 1rem; color: #1a3a5c; font-weight: bold; letter-spacing: 0.05em; margin-bottom: 16px; }
    .progress { font-size: 0.82rem; color: #888; text-align: center; margin-bottom: 14px; }

    .hidden-text {
      background: #2c2c2c; color: #2c2c2c; border-radius: 6px;
      line-height: 2.3; font-size: 1rem; padding: 16px; margin-bottom: 20px;
      user-select: none; -webkit-user-select: none;
      transition: color 0.3s, background 0.3s;
    }
    .hidden-text.revealed { background: transparent; color: #2c2c2c; }

    .reveal-btn {
      display: block; width: 100%; padding: 15px;
      background: #1a3a5c; color: white; border: none; border-radius: 8px;
      font-size: 1rem; cursor: pointer; font-family: inherit; letter-spacing: 0.05em;
    }
    .reveal-btn.revealed { background: #888; }

    .nav-btns { display: flex; gap: 12px; margin-top: 16px; }
    .nav-btn {
      flex: 1; padding: 12px; background: #f0f0f0; border: 1px solid #ccc;
      border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.9rem;
    }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }

    @media (max-width: 480px) {
      .practice-card { padding: 16px 12px; }
      .main { padding: 20px 10px; }
    }
  </style>
</head>
<body>

<header>
  <button id="menu-btn" onclick="openSidebar()">☰</button>
  <h1>日本国憲法 暗記ツール</h1>
</header>

<div id="overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:150;" onclick="closeSidebar()"></div>

<div id="sidebar" style="display:none; position:fixed; top:0; left:0; bottom:0; width:85%; max-width:320px; background:#fff; z-index:200; flex-direction:column; box-shadow:4px 0 24px rgba(0,0,0,0.25);">
  <div class="sidebar-top">
    <button id="close-btn" onclick="closeSidebar()">✕</button>
    <span>条文を選択</span>
  </div>
  <div class="sidebar-scroll">
    <div id="chapter-list"></div>
  </div>
  <div class="sidebar-footer">
    <div class="multi-controls">
      <button onclick="selectAll()">全選択</button>
      <button onclick="clearAll()">解除</button>
    </div>
    <button id="start-btn" class="start-btn" onclick="startPractice()" disabled>練習開始</button>
  </div>
</div>

<div class="main" id="main">
  <div class="empty-state">☰ を押して条文を選び<br>練習を開始してください</div>
</div>

<script>
  function openSidebar() {
    document.getElementById('sidebar').style.display = 'flex';
    document.getElementById('overlay').style.display = 'block';
  }
  function closeSidebar() {
    document.getElementById('sidebar').style.display = 'none';
    document.getElementById('overlay').style.display = 'none';
  }
  function toggleSidebar() { openSidebar(); }
</script>

<script src="articles.js"></script>
<script src="app.js"></script>
</body>
</html>
